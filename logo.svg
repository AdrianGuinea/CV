<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0A1622"/>

  <!-- monogram AG built from two strokes -->
  <g fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- A -->
    <path d="M118 360 L186 152 L254 360"/>
    <line x1="146" y1="280" x2="226" y2="280"/>
  </g>
  <g fill="none" stroke="#5FD3E0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- G -->
    <path d="M400 214 A 88 88 0 1 0 400 298 L 400 284 L 364 284"/>
  </g>

  <!-- signal node: the telecom detail -->
  <circle cx="256" cy="106" r="16" fill="#5FD3E0"/>
  <path d="M206 80 A 72 72 0 0 1 306 80" fill="none" stroke="#5FD3E0" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
