<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1622"/>
      <stop offset="1" stop-color="#14304A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FD3E0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5FD3E0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5FD3E0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#5FA8B8" stroke-width="1" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#grid)"/>

  <!-- light trails, like long-exposure network traffic -->
  <g fill="none" stroke="url(#beam)" stroke-width="3" stroke-linecap="round">
    <path d="M700 300 C 900 220, 1000 260, 1180 170 S 1420 90, 1584 130"/>
    <path d="M660 350 C 880 300, 1050 330, 1230 260 S 1450 210, 1584 240"/>
    <path d="M740 240 C 940 150, 1100 190, 1260 110 S 1480 40, 1584 60"/>
  </g>

  <!-- base station tower on the right -->
  <g stroke="#5FD3E0" stroke-width="3" fill="none" opacity="0.85">
    <line x1="1380" y1="330" x2="1380" y2="170"/>
    <line x1="1380" y1="170" x2="1355" y2="330"/>
    <line x1="1380" y1="170" x2="1405" y2="330"/>
    <line x1="1362" y1="240" x2="1398" y2="240"/>
    <line x1="1355" y1="290" x2="1405" y2="290"/>
    <path d="M1340 150 A 56 56 0 0 1 1340 90"/>
    <path d="M1420 150 A 56 56 0 0 0 1420 90"/>
    <path d="M1310 165 A 92 92 0 0 1 1310 75"/>
    <path d="M1450 165 A 92 92 0 0 0 1450 75"/>
  </g>
  <circle cx="1380" cy="165" r="8" fill="#5FD3E0"/>
  <line x1="1290" y1="330" x2="1490" y2="330" stroke="#5FD3E0" stroke-width="2" opacity="0.5"/>

  <!-- accent rule and text: short tagline only -->
  <rect x="110" y="150" width="56" height="4" fill="#5FD3E0"/>
