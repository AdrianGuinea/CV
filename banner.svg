  <text x="110" y="262" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#A9C4D2">Telecommunication Engineering</text>
  <text x="110" y="314" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#5FD3E0">C · POSIX · IPv4/IPv6 · Ethernet · Routing · PHP · Git</text>
